<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>Money Canvas — Personal Wealth & Investment Operating System</title>
    <meta name="description" content="Comprehensive personal wealth, double-entry accounting, investment portfolio, banking, and financial analytics management system." />
    <meta name="theme-color" content="#020617" />
    <script>
      // UX-3: apply the saved color theme before first paint to avoid a flash
      (function () {
        try {
          var t = localStorage.getItem('pfos_theme');
          var ok = ['emerald-dark', 'ocean-dark', 'royal-dark', 'soft-light'];
          document.documentElement.dataset.theme = ok.indexOf(t) >= 0 ? t : 'emerald-dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'emerald-dark';
        }
      })();
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Money Canvas" />
    <meta name="application-name" content="Money Canvas" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="Money Canvas — Personal Wealth & Investment Operating System" />
    <meta property="og:description" content="Comprehensive personal wealth, double-entry accounting, investment portfolio, banking, and financial analytics management system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Icons & Manifest link (Injected by VitePWA) -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500/20 selection:text-emerald-300 overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
