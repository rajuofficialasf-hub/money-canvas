          <text x="0" y="74" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Instant SMS sync enabled</text>
        </g>
      </g>
    </g>

    <!-- Recent Double-Entry Ledger Transactions -->
